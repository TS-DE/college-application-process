# ============================================================
# 高考志愿填报系统 · 可选 Nginx 前置配置（前后端分离部署形态）
#
# 何时使用：
#   协作方要求"前端必须是独立服务"时启用。
#   默认单体托管（后端直接提供页面）**不需要**本文件。
#
# 启用方式：
#   1) docker-compose.yml 中取消 frontend 服务注释
#   2) docker compose up -d frontend
#   3) 浏览器访问 http://<主机IP>/（80 端口）
#
# 说明：
#   - 静态文件来自挂载的 ../frontend/dist（镜像内不打包）
#   - /api 反向代理到 compose 内的 backend:8000
#   - 前端代码无需改动：API 走相对路径 /api，天然同源，无 CORS 问题
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 知识库上传上限：后端限制 20MB，这里给 30m 余量（默认 1m 会直接 413）
    client_max_body_size 30m;

    # 上传大文件/OCR 解析较慢，放宽超时
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---- 静态资源：带 hash 的产物长期缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 流式/长连接场景（如后续接入 SSE）保持不缓冲
        proxy_buffering    off;
    }

    # ---- SPA 路由回退：history 模式下刷新子路由不 404 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 压缩 ----
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;
    gzip_vary         on;
}
