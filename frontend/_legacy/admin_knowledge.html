<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · 知识库 | 高考志愿填报系统</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ---- 后台布局（参考 DataKnow） ---- */
    .admin-shell { display: flex; min-height: 100vh; background: #f5f6f8; }
    .admin-side {
      width: 220px; flex-shrink: 0; background: #fff;
      border-right: 1px solid var(--border); padding: 18px 0;
    }
    .admin-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 17px; padding: 0 20px 18px;
      border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .admin-logo .dot {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .admin-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
    .admin-nav a {
      padding: 9px 12px; border-radius: 8px; color: var(--text-sub);
      text-decoration: none; font-size: 14px;
    }
    .admin-nav a:hover { background: #f2f4f7; }
    .admin-nav a.on { background: #eef2ff; color: var(--primary); font-weight: 600; }
    .admin-nav .nav-group { font-size: 12px; color: var(--text-muted); padding: 14px 12px 4px; }

    .admin-main { flex: 1; padding: 22px 28px; min-width: 0; }
    .admin-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .admin-toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .admin-toolbar .right { display: flex; gap: 8px; }
    .admin-search {
      width: 240px; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px; background: #fff;
    }
    .kb-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .kb-table th, .kb-table td { padding: 12px 16px; font-size: 13px; text-align: left; }
    .kb-table th { background: #fafbfc; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); }
    .kb-table td { border-bottom: 1px solid #f0f1f3; color: var(--text); }
    .kb-table tr:last-child td { border-bottom: none; }
    .kb-table .op { display: flex; gap: 14px; }
    .kb-table .op a { color: var(--primary); cursor: pointer; font-size: 13px; text-decoration: none; }
    .kb-table .op a.danger { color: var(--danger); }
    .admin-login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f6f8; }
    .admin-login { width: 360px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 28px; }
    .admin-login h1 { font-size: 19px; margin-bottom: 4px; }
    .admin-login .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
    .admin-user { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-sub); }
    .admin-user b { color: var(--text); }
    .icon-btn { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
    .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: #fff; border-radius: var(--radius); width: 420px; max-width: 92vw; padding: 20px 22px; box-shadow: var(--shadow-lg); }
    .modal-card h3 { font-size: 16px; margin-bottom: 14px; }
    .detail-row { display: flex; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed #eef0f2; }
    .detail-row .k { width: 84px; color: var(--text-muted); flex-shrink: 0; }
    .detail-row .v { word-break: break-all; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 登录视图 -->
  <div class="admin-login-wrap" id="login-view">
    <form class="admin-login" id="login-form">
      <h1>后台管理系统</h1>
      <p class="sub">高考志愿填报系统 · 知识库管理（仅管理员）</p>
      <div class="field" style="margin-bottom:12px">
        <label>用户名</label>
        <input id="login-username" autocomplete="username" placeholder="请输入用户名" />
      </div>
      <div class="field" style="margin-bottom:18px">
        <label>密码</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <p class="field-error" id="login-error"></p>
      <button class="btn btn-primary" style="width:100%" type="submit">登 录</button>
      <p style="font-size:12px;color:var(--text-muted);margin-top:12px;text-align:center">
        默认账号 admin / admin123（可用 create_admin.py 修改）
      </p>
    </form>
  </div>

  <!-- 管理视图 -->
  <div class="admin-shell hidden" id="admin-view">
    <aside class="admin-side">
      <div class="admin-logo"><span class="dot">高</span>志愿后台</div>
      <nav class="admin-nav">
        <a href="/">返回考生端</a>
        <span class="nav-group">知识管理</span>
        <a href="/admin/knowledge" class="on">知识库</a>
        <span class="nav-group">系统管理</span>
        <a href="javascript:void(0)" id="logout-btn">退出登录</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="admin-title">知识库</div>
        <div class="admin-user">当前用户：<b id="admin-name"></b></div>
      </div>

      <div class="admin-toolbar">
        <button class="btn btn-primary" id="upload-btn">上传</button>
        <div class="right">
          <input class="admin-search" id="search-input" placeholder="搜索文件名" />
          <button class="btn" id="search-btn">搜索</button>
        </div>
      </div>

      <input type="file" id="file-input" accept=".pdf,.txt,.docx" class="hidden" />
      <table class="kb-table">
        <thead>
          <tr><th>文件名称</th><th style="width:110px">大小</th><th style="width:180px">上传时间</th><th style="width:130px">操作</th></tr>
        </thead>
        <tbody id="kb-tbody"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
      </table>
    </main>
  </div>

  <div id="toast-box"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
